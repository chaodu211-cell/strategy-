name: Daily strategy NAV and GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 纽约时间：20:47 跟进最优拟合收盘后发布，04:57 和 07:53 盘前补查，12:07 跟进 CCC。
    # 留出 Actions 排队、上游提交和 Pages 发布时间，账本按实际可用时间观察信号。
    - cron: "47 20 * * 1-5"
      timezone: "America/New_York"
    - cron: "57 4 * * 1-5"
      timezone: "America/New_York"
    - cron: "53 7 * * 1-5"
      timezone: "America/New_York"
    - cron: "7 12 * * 1-5"
      timezone: "America/New_York"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: strategy-daily-pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 排队期间其他运行可能已推进账本，开始时读取分支最新账本。
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore research inputs
        run: node scripts/build-pages.mjs --restore-only
      - name: Verify causal execution and momentum
        run: node scripts/test_forward.mjs
      - name: Update models, holdings and append NAV
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/daily-update.mjs
      - name: Save daily ledger
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tracking public/forward.json public/update-status.json public/daily-live.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update observed strategy targets and forward NAV'
            git push
          fi
      - name: Build Pages
        run: node scripts/build-pages.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - uses: actions/deploy-pages@v4
        id: deployment

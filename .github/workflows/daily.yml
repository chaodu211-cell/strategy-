name: Daily strategy NAV and GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 2,10 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: strategy-daily-pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore research inputs
        run: node scripts/build-pages.mjs --restore-only
      - name: Verify causal execution and momentum
        run: node scripts/test_forward.mjs
      - name: Update models, holdings and append NAV
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/daily-update.mjs
      - name: Save daily ledger
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tracking public/forward.json public/update-status.json public/daily-live.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update observed strategy targets and forward NAV'
            git push
          fi
      - name: Build Pages
        run: node scripts/build-pages.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - uses: actions/deploy-pages@v4
        id: deployment
